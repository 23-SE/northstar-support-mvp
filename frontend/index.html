<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northstar Retail - Help Centre</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238a1f4b'/%3E%3Cpath d='M32 12l5.5 16.5H54l-14 10.2 5.4 16.4L32 1.5 18.6 55.1l5.4-16.4L10 28.5h16.5L32 12z' fill='white'/%3E%3C/svg%3E" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">★ Northstar Retail</div>
    <div class="tag">Self-Service Help Centre</div>
  </header>

  <main class="container">
    <p class="intro">Get an instant answer before opening a ticket. Pick a topic below.</p>

    <div class="deflection-banner" id="deflection-banner"></div>

    <nav class="tabs">
      <button class="tab active" data-tab="order">Order Status</button>
      <button class="tab" data-tab="return">Returns &amp; Refunds</button>
      <button class="tab" data-tab="stock">Stock Check</button>
    </nav>

    <section class="panel active" id="panel-order">
      <label for="order-input">Enter your order number</label>
      <div class="row">
        <input id="order-input" placeholder="e.g. ORD-1001" />
        <button onclick="lookupOrder()">Check</button>
      </div>
      <div class="result" id="order-result"></div>
    </section>

    <section class="panel" id="panel-return">
      <label for="return-input">Enter your order number</label>
      <div class="row">
        <input id="return-input" placeholder="e.g. ORD-1001" />
        <button onclick="lookupReturn()">Check</button>
      </div>
      <div class="result" id="return-result"></div>
    </section>

    <section class="panel" id="panel-stock">
      <label for="stock-input">Search products</label>
      <div class="row">
        <input id="stock-input" placeholder="e.g. tee, shoe" />
        <button onclick="lookupStock()">Search</button>
      </div>
      <div class="result" id="stock-result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
